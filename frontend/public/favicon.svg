<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Canhoto">
  <!-- Fundo verde da marca para o icone se destacar na aba do navegador -->
  <rect width="32" height="32" rx="7" fill="#B9F706"/>
  <!-- Ingresso preto com a borda direita em serrilha (arcos alternando o sentido) -->
  <path fill="#13171A" d="M6 9 H23
           a1.75 1.75 0 0 1 0 3.5
           a1.75 1.75 0 0 0 0 3.5
           a1.75 1.75 0 0 1 0 3.5
           a1.75 1.75 0 0 0 0 3.5
           H6 a2 2 0 0 1 -2-2 V11 a2 2 0 0 1 2-2 Z"/>
  <!-- QR simplificado: tres marcadores de canto em verde -->
  <g fill="#B9F706">
    <rect x="6.6" y="11.4" width="4.2" height="4.2"/>
    <rect x="14.6" y="11.4" width="4.2" height="4.2"/>
    <rect x="6.6" y="16.8" width="4.2" height="4.2"/>
  </g>
  <g fill="#13171A">
    <rect x="7.9" y="12.7" width="1.6" height="1.6"/>
    <rect x="15.9" y="12.7" width="1.6" height="1.6"/>
    <rect x="7.9" y="18.1" width="1.6" height="1.6"/>
  </g>
  <g fill="#FCFAF6">
    <rect x="12.2" y="16.8" width="1.7" height="1.7"/>
    <rect x="14.6" y="19.2" width="1.7" height="1.7"/>
    <rect x="17" y="16.8" width="1.7" height="1.7"/>
  </g>
</svg>
