services:
  postgres:
    image: postgres:16-alpine
    container_name: canhoto-postgres
    environment:
      POSTGRES_DB: canhoto
      POSTGRES_USER: canhoto_user
      POSTGRES_PASSWORD: canhoto_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U canhoto_user -d canhoto"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: canhoto-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: canhoto_user
      RABBITMQ_DEFAULT_PASS: canhoto_pass
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  rabbitmq_data:
