name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (build + testes)
    runs-on: ubuntu-latest

    # Postgres e RabbitMQ reais para os testes de integração (@SpringBootTest).
    # Credenciais batem com os defaults do application.yml (localhost:5432 / :5672).
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: canhoto_user
          POSTGRES_PASSWORD: canhoto_pass
          POSTGRES_DB: canhoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U canhoto_user -d canhoto"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3.13-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: canhoto_user
          RABBITMQ_DEFAULT_PASS: canhoto_pass
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build e testes
        working-directory: backend
        run: mvn -B verify

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      # Os specs ficam fora do build de producao, entao so o build nao pegaria
      # um teste quebrado. Rodamos a suite explicitamente, em Chrome headless.
      - name: Testes unitários
        working-directory: frontend
        run: npm test -- --watch=false --browsers=ChromeHeadless

      - name: Build de produção
        working-directory: frontend
        run: npm run build
