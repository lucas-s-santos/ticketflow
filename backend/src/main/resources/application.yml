spring:
  application:
    name: ticketflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketflow
    username: ticketflow_user
    password: ticketflow_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # CRÍTICO: Flyway gerencia o schema. Hibernate apenas valida.
      # Nunca usar 'create' ou 'update' — apagaria dados ou criaria colunas erradas.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      # Chave em Base64 com pelo menos 256 bits (32 bytes) para HMAC-SHA256.
      # Em produção, substituir por variável de ambiente: APP_SECURITY_JWT_SECRET_KEY
      secret-key: "dGlja2V0Zmxvdy1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc="
      expiration-ms: 86400000   # 24 horas em milissegundos

logging:
  level:
    com.ticketflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
