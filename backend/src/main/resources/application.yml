spring:
  application:
    name: ticketflow-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/ticketflow
    username: ticketflow_user
    password: ticketflow_pass
    driver-class-name: org.postgresql.Driver

  # Conexão com o RabbitMQ (mesmas credenciais do docker-compose.yml)
  rabbitmq:
    host: localhost
    port: 5672
    username: ticketflow_user
    password: ticketflow_pass
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3          # tentativas antes de desistir
          initial-interval: 2000   # 2s na 1ª retentativa, dobrando a cada vez
          multiplier: 2
          max-interval: 10000
        # mensagem que esgotou as tentativas vai para a DLQ em vez de voltar pra fila
        default-requeue-rejected: false

  jpa:
    hibernate:
      # CRÍTICO: Flyway gerencia o schema. Hibernate apenas valida.
      # Nunca usar 'create' ou 'update' — apagaria dados ou criaria colunas erradas.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  # Render (e outras PaaS) injetam a porta via variável PORT; localmente cai em 8080.
  port: ${PORT:8080}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Origens permitidas no CORS (separadas por vírgula). Em produção, a URL da Vercel.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

  security:
    jwt:
      # Chave em Base64 com pelo menos 256 bits (32 bytes) para HMAC-SHA256.
      # Em produção, substituir por variável de ambiente: APP_SECURITY_JWT_SECRET_KEY
      secret-key: "dGlja2V0Zmxvdy1kZXYtc2VjcmV0LWtleS1tdXN0LWJlLWF0LWxlYXN0LTI1Ni1iaXRzLWxvbmc="
      expiration-ms: 86400000   # 24 horas em milissegundos

  # Gateway de pagamento simulado
  payment:
    failure-rate: 0.0          # 0.0 = sempre aprova; 0.15 simularia ~15% de recusas
    processing-delay-ms: 2000  # latência simulada do gateway (0 nos testes)

  # Webhook do gateway: assinatura HMAC e URL de entrega
  webhook:
    secret: "ticketflow-webhook-hmac-secret-key-troque-em-producao"
    url: http://localhost:8080/api/webhooks/payments   # destino do webhook do gateway simulado

  # Ingresso: segredo HMAC que assina os tokens do QR code (separado do webhook)
  ticket:
    secret: "ticketflow-ticket-hmac-secret-troque-em-producao"

logging:
  level:
    com.ticketflow: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
