spring:
  application:
    name: canhoto-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/canhoto
    username: canhoto_user
    password: canhoto_pass
    driver-class-name: org.postgresql.Driver

  # Conexão com o RabbitMQ (mesmas credenciais do docker-compose.yml)
  rabbitmq:
    host: localhost
    port: 5672
    username: canhoto_user
    password: canhoto_pass
    listener:
      simple:
        retry:
          enabled: true
          max-attempts: 3          # tentativas antes de desistir
          initial-interval: 2000   # 2s na 1ª retentativa, dobrando a cada vez
          multiplier: 2
          max-interval: 10000
        # mensagem que esgotou as tentativas vai para a DLQ em vez de voltar pra fila
        default-requeue-rejected: false

  jpa:
    hibernate:
      # CRÍTICO: Flyway gerencia o schema. Hibernate apenas valida.
      # Nunca usar 'create' ou 'update' — apagaria dados ou criaria colunas erradas.
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Teto do tamanho de pagina. Sem isto, ?size=1000000 devolveria a tabela
  # inteira e anularia a paginacao.
  data:
    web:
      pageable:
        default-page-size: 12
        max-page-size: 50

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  # Render (e outras PaaS) injetam a porta via variável PORT; localmente cai em 8080.
  port: ${PORT:8080}
  # Faz o Spring resolver X-Forwarded-For, senão atrás do proxy do Render todos
  # os clientes chegariam com o mesmo IP e um único atacante bloquearia todo mundo.
  forward-headers-strategy: framework

# Actuator: so o endpoint de health, sem detalhes internos para quem nao esta autenticado.
# E o alvo do health check do Render — barato e nao consulta o banco.
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Origens permitidas no CORS (separadas por vírgula). Em produção, a URL da Vercel.
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:4200}

  security:
    jwt:
      # Chave em Base64 com pelo menos 256 bits (32 bytes) para HMAC-SHA256.
      # Em produção, substituir por variável de ambiente: APP_SECURITY_JWT_SECRET_KEY
      secret-key: "6bRJZkTCjvyBU/NfKoRZU7pxsEc/kAfuVaTFccP+q9Q="
      expiration-ms: 86400000   # 24 horas em milissegundos

    # Teto de tentativas de login/cadastro por origem, numa janela deslizante.
    # 10 em 5 minutos incomoda quem erra a senha algumas vezes e inviabiliza
    # varredura automatizada, que precisa de milhares.
    rate-limit:
      login:
        max-attempts: 10
        window-seconds: 300

  # Gateway de pagamento simulado
  payment:
    failure-rate: 0.0          # 0.0 = sempre aprova; 0.15 simularia ~15% de recusas
    processing-delay-ms: 2000  # latência simulada do gateway (0 nos testes)

  # Webhook do gateway: assinatura HMAC e URL de entrega
  webhook:
    secret: "canhoto-webhook-hmac-secret-troque-em-producao"
    url: http://localhost:8080/api/webhooks/payments   # destino do webhook do gateway simulado

  # Ingresso: segredo HMAC que assina os tokens do QR code (separado do webhook)
  ticket:
    secret: "canhoto-ticket-hmac-secret-troque-em-producao"

logging:
  level:
    com.canhoto: DEBUG
    org.springframework.web: INFO
    org.hibernate.SQL: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
